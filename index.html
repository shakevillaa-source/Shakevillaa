<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shake Villa - Refreshing Shakes & Mojitos</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }
  
  body {
    background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
    color: #333;
    text-align: center;
  }

  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: url('https://images.unsplash.com/photo-1551024709-8f23befc6f87?q=80&w=800') no-repeat center/cover;
  }

  /* Glass effect logo */
  .logo {
    font-size: 4rem;
    font-weight: 800;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 20px 50px;
    border-radius: 20px;
    color: #fff;
    text-shadow: 0 4px 15px rgba(0,0,0,0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .tagline {
    font-size: 1.5rem;
    color: #fff;
    margin-bottom: 30px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .btn {
    background: #2ecc71;
    color: white;
    padding: 15px 35px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
  }
  
  .btn:hover {
    background: #27ae60;
    transform: translateY(-3px);
  }

  .menu {
    padding: 60px 20px;
    background: #fff;
  }

  .menu h2 {
    font-size: 2.5rem;
    margin-bottom: 40px;
    color: #27ae60;
  }

  .items {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }

  .card {
    background: #f8f8f8;
    border-radius: 15px;
    padding: 20px;
    width: 250px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>

  <section class="hero">
    <h1 class="logo">SHAKE VILLA</h1>
    <p class="tagline">Sip The Freshness 🍃 Mojito | Shakes | Coolers</p>
    <a href="#menu" class="btn">Order Now</a>
  </section>

  <section class="menu" id="menu">
    <h2>Our Specials</h2>
    <div class="items">
      <div class="card">
        <h3>Classic Mojito</h3>
        <p>Mint, Lime & Soda</p>
      </div>
      <div class="card">
        <h3>Chocolate Shake</h3>
        <p>Thick & Creamy</p>
      </div>
      <div class="card">
        <h3>Blue Lagoon</h3>
        <p>Refreshing & Blue</p>
      </div>
    </div>
  </section>

</body>
</html>
