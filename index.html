<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Coding Cafe | Code. Sip. Repeat.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">&lt;Coding_Cafe&sol;&gt;</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#events">Events</a>
            <a href="#booking" class="btn-nav">Book a Desk</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Where <span class="highlight">Coffee</span> Meets <span class="code-text">Code</span>.</h1>
            <p>High-speed internet, premium coffee, and a community of developers.</p>
            <a href="#booking" class="btn-primary">Reserve Your Workspace</a>
        </div>
    </section>

    <!-- Booking Section -->
    <section id="booking" class="booking-section">
        <h2>Reserve Your Coding Desk</h2>
        <form class="booking-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="date">Select Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="slot">Time Slot</label>
                <select id="slot">
                    <option>Morning (8 AM - 1 PM)</option>
                    <option>Evening (1 PM - 6 PM)</option>
                    <option>Night Owl (6 PM - 11 PM)</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Confirm Booking</button>
        </form>
    </section>

</body>
</html>
