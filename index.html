<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shake Villa - Digital Menu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icons ke liye FontAwesome Link -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="app-container">
        
        <!-- Header Banner Section -->
        <header class="header-banner">
            <div class="lang-switch">
                <span>हिंदी</span> | <span class="active">EN</span>
            </div>
            <div class="brand-info">
                <h1>Shake Villa 🍹</h1>
                <!-- Google Maps Direction Link -->
                <a href="https://google.com" target="_blank" class="address-link">
                    <i class="fa-solid fa-location-dot"></i> Shop No. 5, Bilal Masjid, Ravli Road, Muradnagar
                </a>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="menu-nav">
            <a href="#home" class="nav-item active"><i class="fa-solid fa-house"></i> Home</a>
            <a href="#menu" class="nav-item"><i class="fa-solid fa-utensils"></i> Menu</a>
        </nav>

        <!-- Search Bar -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search your favorite shake...">
        </div>

        <!-- Contact Quick Actions -->
        <div class="quick-contact-bar">
            <a href="tel:+919808080686" class="contact-card">
                <i class="fa-solid fa-phone"></i>
                <span>Call Us</span>
            </a>
            <a href="mailto:shakevillaa@gmail.com" class="contact-card">
                <i class="fa-solid fa-envelope"></i>
                <span>Email Us</span>
            </a>
        </div>

        <!-- Categories Section -->
        <section class="categories-section">
            <h2>Explore Our Menu</h2>
            <div class="category-grid">
                <div class="category-card">
                    <img src="https://unsplash.com" alt="Special Milkshakes">
                    <h3>Special Milkshakes</h3>
                </div>
                <div class="category-card">
                    <img src="https://unsplash.com" alt="Thick Shakes">
                    <h3>Thick Shakes</h3>
                </div>
                <div class="category-card">
                    <img src="https://unsplash.com" alt="Cold Coffees">
                    <h3>Cold Coffees</h3>
                </div>
                <div class="category-card">
                    <img src="https://unsplash.com" alt="Quick Snacks">
                    <h3>Quick Snacks</h3>
                </div>
            </div>
        </section>

        <!-- Social Connect Sticky Footer -->
        <footer class="social-footer">
            <a href="https://wa.me" target="_blank" class="social-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Order on WhatsApp
            </a>
            <a href="https://instagram.com" target="_blank" class="social-btn instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
        </footer>

    </div>

</body>
</html>
